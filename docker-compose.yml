version: '3.8'

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Nexont - Docker Compose (Producción / Integración Completa)             ║
# ║                                                                          ║
# ║  Uso:                                                                    ║
# ║    docker compose up -d --build                                          ║
# ║    Abrir http://localhost                                                ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:

  # ─── Reverse Proxy (Gateway) ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexont_gateway
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - core-api
      - frontend
      - chatbot-service

  # ─── Frontend (React/Vue/Vite servido por su propio Nginx) ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexont_frontend
    restart: unless-stopped
    # Nota: No exponemos puertos hacia afuera, el Gateway (nginx) rutea el tráfico hacia aquí

    # ─── Microservicio Principal (Core API) ──────────────────────────────────
  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: nexont_core_api
    restart: unless-stopped
    env_file:
      - ./core-api/.env
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # ─── Microservicio Chatbot (Node.js) ─────────────────────────────────────
  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    container_name: nexont_chatbot
    restart: unless-stopped
    env_file:
      - ./chatbot-service/.env

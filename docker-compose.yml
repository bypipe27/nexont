
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Nexont - Docker Compose (Desarrollo)                                   ║
# ║                                                                          ║
# ║  Uso:                                                                    ║
# ║    docker compose up postgres redis rabbitmq mongodb nginx -d            ║
# ║    cd core-api && npm run dev       (terminal 1)                         ║
# ║    cd frontend && npm run dev       (terminal 2)                         ║
# ║    Abrir http://localhost                                                ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:

  # ─── Reverse Proxy (Gateway) ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexont_nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    network_mode: host

  # ─── Infraestructura ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexont_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexont
      POSTGRES_PASSWORD: nexont_pass
      POSTGRES_DB: nexont_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexont']
      interval: 5s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexont_rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'

volumes:
  postgres_data:

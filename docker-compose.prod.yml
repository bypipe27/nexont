# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Nexont - Docker Compose (Produccion)                                   ║
# ║                                                                          ║
# ║  Uso:                                                                    ║
# ║    docker compose -f docker-compose.prod.yml --env-file .env.prod up -d  ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:

  # ─── Reverse Proxy (Gateway) ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexont_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - frontend_build:/usr/share/nginx/html
    depends_on:
      core-api:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    restart: always

  # ─── Core API (Monolito Modular) ─────────────────────────────────────────
  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: nexont_core_api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://nexont:${DB_PASSWORD}@postgres:5432/nexont_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - APP_URL=${APP_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ─── Frontend (Build estático) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexont_frontend_builder
    volumes:
      - frontend_build:/app/dist
    restart: 'no'

  # ─── Microservicios ──────────────────────────────────────────────────────
  chat-service:
    build: ./services/chat-service
    container_name: nexont_chat
    env_file:
      - ./services/chat-service/.env
    depends_on:
      - redis
      - mongodb
      - rabbitmq
    restart: always

  chatbot-service:
    build: ./services/chatbot-service
    container_name: nexont_chatbot
    env_file:
      - ./services/chatbot-service/.env
    depends_on:
      - redis
      - rabbitmq
    restart: always

  search-service:
    build: ./services/search-service
    container_name: nexont_search
    env_file:
      - ./services/search-service/.env
    depends_on:
      - redis
    restart: always

  # ─── Infraestructura ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexont_postgres
    environment:
      POSTGRES_USER: nexont
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nexont_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexont']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  mongodb:
    image: mongo:7
    container_name: nexont_mongo
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: nexont_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: nexont_rabbitmq
    restart: always

volumes:
  postgres_data:
  mongo_data:
  frontend_build:
